services:
  - type: web
    name: ghs-inspections
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/team/state
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: ghs-data
      mountPath: /data
      sizeGB: 1
